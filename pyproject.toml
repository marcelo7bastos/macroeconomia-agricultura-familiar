[project]
name = "macroaf"
version = "0.1.0"
description = "Indicadores macroeconômicos da agricultura e da agricultura familiar no Brasil, a partir de dados públicos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macroaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
# Códigos HTTP e formatos fixos são mais legíveis literais; funções de orquestração recebem
# vários parâmetros nomeados.
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
