name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    # A suíte leva cerca de 3 minutos; um travamento vira falha em vez de horas "em progresso".
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências
        run: uv sync --all-groups --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -v --durations=15
