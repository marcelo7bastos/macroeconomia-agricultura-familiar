name: Atualização dos dados

# Baixa do IBGE o que mudou, refaz a série longa, os indicadores e os marts e faz commit na main
# só se algo mudou e tudo passou: validações, conferências e testes (#9, decisão 0003).
# IPCA e IPCA-15 têm calendários próprios; consultar diariamente evita fixar a divulgação.
# Uma falha aparece no Actions e o GitHub avisa por e-mail quem mantém o agendamento.
# Agendamentos de repositório público são desligados após 60 dias sem atividade no repositório;
# os commits mensais desta rotina mantêm o agendamento ativo, mas, se o IBGE ficar sem divulgar ou
# a rotina falhar por mais de 60 dias, o GitHub desliga o agendamento: reative em Actions.
# O push usa o GITHUB_TOKEN: exige a main sem proteção que obrigue PR, e não dispara o ci.yml (os
# testes rodam aqui, antes do commit).

on:
  schedule:
    - cron: "23 12 * * *" # 09:23 em Brasília, depois da divulgação das 9h
  workflow_dispatch:
    inputs:
      indice:
        description: "Índice a atualizar"
        type: choice
        options: [todos, ipca15, ipca]
        default: todos
      forcar:
        description: "Republicar mesmo sem mês novo ou revisado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizacao-dos-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        indice: ${{ fromJSON(inputs.indice == 'ipca' && '["ipca"]' || inputs.indice == 'ipca15' && '["ipca15"]' || '["ipca15","ipca"]') }}
    env:
      INDICE: ${{ matrix.indice }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências
        run: uv sync --all-groups --locked
      - name: Atualizar do IBGE até os marts
        id: pipeline
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then
            uv run python -m macroaf.pipeline --indice "$INDICE" --forcar
          else
            uv run python -m macroaf.pipeline --indice "$INDICE"
          fi
      - name: Ver se algo mudou no repositório
        id: mudancas
        run: |
          if [ -n "$(git status --porcelain -- data reference docs)" ]; then
            echo "houve=true" >> "$GITHUB_OUTPUT"
            git status --short -- data reference docs
          else
            echo "houve=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Testes (marts e páginas em dia, indicadores contra o IBGE)
        if: steps.mudancas.outputs.houve == 'true'
        timeout-minutes: 20
        run: uv run pytest -v --durations=15
      - name: Commit e push na main
        if: steps.mudancas.outputs.houve == 'true'
        run: |
          ultimo=$(python3 -c "import json, os; print(json.load(open('data/metadata.json'))[os.environ['INDICE']]['ultimo_mes'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reference docs
          git commit -m "Atualiza os dados do ${INDICE} até ${ultimo}" -m "Gerado pelo workflow de atualização (#9)."
          git pull --rebase origin main
          git push
